name: Fetch Tracker Log

on:
  schedule:
    # Every 24 hours (daily at 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      AP_ROOM_PORT: '56640'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tracker log
        env:
          AP_SESSION_COOKIE: ${{ secrets.AP_SESSION_COOKIE }}
        run: |
          rooms_json="$(curl -sSf -H "Cookie: ${AP_SESSION_COOKIE}" https://archipelago.gg/api/get_rooms)"
          room_id="$(
            jq -r --argjson port "${AP_ROOM_PORT}" \
              '.[] | select(.last_port == $port) | .room_id' \
              <<< "${rooms_json}" \
              | head -n 1
          )"

          if [ -z "${room_id}" ] || [ "${room_id}" = "null" ]; then
            echo "No Archipelago room owned by the session cookie is currently on port ${AP_ROOM_PORT}." >&2
            exit 1
          fi

          curl -sSf \
            -H "Cookie: ${AP_SESSION_COOKIE}" \
            "https://archipelago.gg/log/${room_id}" \
            -o public/default-tracker.txt

          if ! grep -q '^\[[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\} ' public/default-tracker.txt; then
            echo "Fetched content did not look like an Archipelago server log." >&2
            exit 1
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet public/default-tracker.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare timestamp
        if: steps.diff.outputs.changed == 'true'
        id: ts
        run: echo "timestamp=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/default-tracker.txt
          git commit -m "chore: update tracker log ${{ steps.ts.outputs.timestamp }}"
          git push origin HEAD:main
