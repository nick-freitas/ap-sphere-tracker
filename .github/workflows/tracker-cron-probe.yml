name: Tracker Cron Probe

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record trigger
        run: |
          printf '[DEBUG-tracker-cron] event=%s\n' "$GITHUB_EVENT_NAME"
          date -u +'%Y-%m-%dT%H:%M:%SZ'
